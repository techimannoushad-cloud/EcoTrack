<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoTrack - Daily Green Habits</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Header / Dashboard Title -->
    <header class="app-header">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">🌱</span>
        <div>
          <h1>EcoTrack</h1>
          <p class="subtitle">Small daily habits, big positive impact.</p>
        </div>
      </div>
    </header>

    <!-- Progress & Overview Dashboard -->
    <section class="card progress-card" aria-labelledby="progress-heading">
      <div class="progress-header">
        <div>
          <h2 id="progress-heading">Today's Progress</h2>
          <p id="counterText" class="counter-text">0 of 0 habits completed</p>
        </div>
        <div class="percentage-badge">
          <span id="percentageText">0%</span>
        </div>
      </div>

      <div class="progress-bar-container" role="progressbar" id="progressBarContainer" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
        <div class="progress-bar-fill" id="progressBarFill"></div>
      </div>

      <div class="progress-actions">
        <button type="button" id="resetDayBtn" class="btn btn-secondary">
          <span aria-hidden="true">🔄</span> Reset Day
        </button>
      </div>
    </section>

    <!-- Add Habit Form -->
    <section class="card form-card" aria-labelledby="add-habit-heading">
      <h2 id="add-habit-heading">Add a New Habit</h2>
      
      <!-- Feedback Message Area -->
      <div id="feedbackMessage" class="feedback-message" role="status" aria-live="polite"></div>

      <form id="addHabitForm" novalidate>
        <div class="input-group">
          <label for="habitInput" class="visually-hidden">Habit Description</label>
          <input 
            type="text" 
            id="habitInput" 
            placeholder="e.g., Carried a reusable water bottle..." 
            autocomplete="off"
            maxlength="80"
          >
          <button type="submit" id="addHabitBtn" class="btn btn-primary">
            <span>+ Add Habit</span>
          </button>
        </div>
      </form>
    </section>

    <!-- Habit List Section -->
    <section class="card list-card" aria-labelledby="habits-heading">
      <div class="list-header">
        <h2 id="habits-heading">Daily Checklist</h2>
        <span class="list-hint">Check off actions as you do them</span>
      </div>

      <!-- Empty State Notice -->
      <div id="emptyState" class="empty-state">
        <span class="empty-icon" aria-hidden="true">🍃</span>
        <h3>No habits on your list yet!</h3>
        <p>Add your first eco-friendly action above to start building greener daily routines.</p>
      </div>

      <!-- Dynamic Habit List -->
      <ul id="habitList" class="habit-list" aria-live="polite"></ul>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
